name: CodeQL

# Static analysis for injection, unsafe deserialisation and similar flaws in
# the Java code (audit H5). Free for public repositories; findings appear under
# Security -> Code scanning.
on:
  pull_request:
    branches: [main, feature/denteam-parity]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
