spring:
  application:
    name: orthoflow
  profiles:
    # A bare local run (no SPRING_PROFILES_ACTIVE) gets application-dev.yml:
    # SQL and DEBUG logging. Any explicit profile — prod, a staging box —
    # replaces it, so SQL is never logged somewhere just because the profile
    # was not the exact word "prod".
    default: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/orthoflow
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Voice-capture clips only (POST /voice/transcribe). A push-to-talk
      # utterance is tens of KB; a continuous-examination segment rarely
      # passes 1 MB. The ceiling is deliberately generous so a long
      # dictation is not truncated — SpeechToTextService rejects anything
      # over orthoflow.voice.stt.max-audio-bytes with a 400 before the
      # provider call, so this is only the outer backstop.
      max-file-size: ${VOICE_STT_MAX_UPLOAD:15MB}
      max-request-size: 16MB

app:
  jwt:
    # Dev-only default (32+ bytes). ALWAYS override with JWT_SECRET in any
    # shared/production environment — see application-prod.yml.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    # 4h per token. Deactivation/demotion/password-reset are enforced
    # per-request by JwtAuthFilter regardless of this value; shortening it only
    # bounds the theft window.
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:240}
    # A token that expires mid-consultation logs the dentist out of the chart
    # they are dictating onto. POST /auth/refresh therefore swaps a live token
    # for a fresh one — but never past this many minutes after the person
    # actually signed in (12h: one clinic day). It is the longest a stolen
    # token can be kept alive by renewing it; past it only the password works.
    # Set it at or below expiration-minutes to turn renewal off entirely.
    max-session-minutes: ${JWT_MAX_SESSION_MINUTES:720}
  # Base origin used to build the password-reset link sent to users. Override
  # with FRONTEND_URL wherever the frontend isn't served from localhost:4200
  # (see application-prod.yml).
  frontend-url: ${FRONTEND_URL:http://localhost:4200}

# ── Voice-first clinical workflow (audit Part XII) ──────────────────────
# The deterministic grammar that handles structured clinical dictation runs
# in the browser and needs none of this. These settings only govern the
# natural-language fallback for utterances the grammar cannot parse.
orthoflow:
  auth:
    # See AuthController#register. Off in dev so the team can create/reset
    # test accounts freely; turn on once a real practice is onboarded.
    restrict-registration-to-bootstrap: ${RESTRICT_REGISTRATION_TO_BOOTSTRAP:false}
  # Browser origins allowed to call this API. Comma-separated via
  # CORS_ALLOWED_ORIGINS. These were six values hardcoded in SecurityConfig,
  # including another deployment's preprod hostnames — see CorsProperties.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201}
  voice:
    # ── Vendor credentials, shared by every stage ─────────────────────
    # Transcription, interpretation and the summary each fall back from one
    # vendor to another, so a key is held once per vendor rather than once
    # per stage. Server-side only; none of these ever reaches the browser.
    # Each stage's own api-key still works for its primary vendor.
    #
    # data-protected is the operator's statement, per vendor, that the key is
    # on a plan whose terms keep submitted content out of the vendor's model
    # training and that a DPA is in place. The code cannot check a contract, so
    # it stays false until someone has read it, and a vendor that receives
    # patient data without it is named in a startup warning. A free-tier key
    # is the usual reason it is not true.
    providers:
      gemini:
        api-key: ${VOICE_GEMINI_API_KEY:}
        data-protected: ${VOICE_GEMINI_DATA_PROTECTED:false}
      groq:
        api-key: ${VOICE_GROQ_API_KEY:}
        base-url: ${VOICE_GROQ_BASE_URL:https://api.groq.com/openai/v1}
        data-protected: ${VOICE_GROQ_DATA_PROTECTED:false}
      deepseek:
        api-key: ${VOICE_DEEPSEEK_API_KEY:}
        base-url: ${VOICE_DEEPSEEK_BASE_URL:https://api.deepseek.com}
        data-protected: ${VOICE_DEEPSEEK_DATA_PROTECTED:false}
      assemblyai:
        api-key: ${VOICE_ASSEMBLYAI_API_KEY:}
        data-protected: ${VOICE_ASSEMBLYAI_DATA_PROTECTED:false}
        # The EU data-residency endpoint: consultation audio is health data.
        base-url: ${VOICE_ASSEMBLYAI_BASE_URL:https://sync.eu.assemblyai.com/v1}
    nlu:
      # disabled | anthropic | openai-compatible | gemini | groq | deepseek
      #
      # 'disabled' is the safe default. Enabling a provider means
      # transcripts of a consultation — which contain health information about
      # the patient and anyone else in the room — start leaving this machine.
      # That needs a DPA, a lawful basis and a CNDP notification under Law
      # 09-08 first. 'openai-compatible' pointed at a model on this same VPS
      # (e.g. Ollama at http://localhost:11434/v1) answers the question by
      # keeping the data inside the same trust boundary as the database.
      # 'gemini' uses Google's Interactions API — fast, multilingual, and
      # excellent at clinical vocabulary in French/Darija code-switching.
      # When you do enable one, prefer groq over a free-tier Gemini key: that
      # key allows 20 interpretations a day on gemini-3.5-flash, whereas Groq
      # answers in under a second with far more headroom. Gemini is still tried
      # when Groq is unavailable.
      provider: ${VOICE_NLU_PROVIDER:disabled}
      # Used by anthropic and openai-compatible providers.
      model: ${VOICE_NLU_MODEL:claude-opus-5}
      api-key: ${VOICE_NLU_API_KEY:}
      # Required for openai-compatible, e.g. http://localhost:11434/v1
      base-url: ${VOICE_NLU_BASE_URL:}
      timeout-ms: ${VOICE_NLU_TIMEOUT_MS:9000}
      max-transcript-chars: ${VOICE_NLU_MAX_TRANSCRIPT_CHARS:800}
      max-output-tokens: ${VOICE_NLU_MAX_OUTPUT_TOKENS:700}
      # ── Gemini NLU settings ─────────────────────────────────────────
      # When provider=gemini, these take effect. The API key falls back to
      # the STT key (orthoflow.voice.stt.api-key) when blank, so a single
      # Gemini key in .env drives both STT and NLU.
      # gemini-2.5-flash is closed to new API keys (404), so it cannot be the
      # default any more.
      gemini-model: ${VOICE_NLU_GEMINI_MODEL:gemini-3.5-flash}
      gemini-api-key: ${VOICE_NLU_GEMINI_API_KEY:}
      gemini-base-url: ${VOICE_NLU_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      gemini-thinking-level: ${VOICE_NLU_GEMINI_THINKING_LEVEL:low}
      # Tried in order when the primary is overloaded or rate-limited. Needs
      # the vendor key under orthoflow.voice.providers. Never used while the
      # primary is 'disabled'.
      fallbacks: ${VOICE_NLU_FALLBACKS:gemini,deepseek}
      groq-model: ${VOICE_NLU_GROQ_MODEL:qwen/qwen3.8-27b}
      deepseek-model: ${VOICE_NLU_DEEPSEEK_MODEL:deepseek-flash}
    # ── Server-side speech-to-text ─────────────────────────────────────
    # The browser's own SpeechRecognition is the default and needs none of
    # this. Enabling it routes captured audio through a hosted Whisper
    # endpoint instead — which, exactly like the NLU fallback above, sends
    # consultation-room audio to a third party and needs the same DPA,
    # lawful basis and CNDP notification (Law 09-08) first. The API key is
    # read here and never sent to the browser. Point base-url at a
    # self-hosted faster-whisper server to keep audio on-premise.
    stt:
      enabled: ${VOICE_STT_ENABLED:false}
      # The primary recogniser, then each fallback in order, inside one time
      # budget: assemblyai (Universal-3.5 Pro, sync, EU) | gemini (Interactions
      # API) | groq (Whisper). Measured on noisy French dental dictation
      # (September 2026): AssemblyAI answers in ~0.3-0.6 s, keeps its accuracy
      # under handpiece and suction noise, and its confidence separates noise
      # from speech. Gemini adds a vocabulary-normalized reading but a
      # free-tier key allows 5 requests a minute and 20 a day per model — a
      # continuously-listening session spends that in the first minutes — so
      # it is the first fallback, not the primary, unless the key is paid.
      # Whisper hallucinates most on noise and is the last resort.
      provider: ${VOICE_STT_PROVIDER:assemblyai}
      fallbacks: ${VOICE_STT_FALLBACKS:gemini,groq}
      # Used by whichever provider is active — only one runs at a time.
      api-key: ${VOICE_STT_API_KEY:}
      # groq only: whisper-large-v3-turbo (fastest, cheapest) | whisper-large-v3
      model: ${VOICE_STT_MODEL:whisper-large-v3-turbo}
      # groq only.
      base-url: ${VOICE_STT_BASE_URL:https://api.groq.com/openai/v1}
      # gemini only. Its API is neither multipart nor OpenAI-shaped, so it
      # carries its own endpoint and model rather than overloading the two
      # above — switching provider back and forth rewrites neither.
      gemini-base-url: ${VOICE_STT_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      gemini-model: ${VOICE_STT_GEMINI_MODEL:gemini-3.8-flash}
      # Tried when the primary answers 429/5xx ("experiencing high demand") or
      # times out, then preferred for a minute. Blank disables the fallback.
      gemini-fallback-model: ${VOICE_STT_GEMINI_FALLBACK_MODEL:gemini-3.5-flash}
      # Transcription is not a reasoning task and thinking only adds latency
      # to a call a doctor is waiting on mid-examination. Not 'minimal':
      # gemini-3.8-flash rejects it (low | medium | high only).
      gemini-thinking-level: ${VOICE_STT_GEMINI_THINKING_LEVEL:low}
      # The fallback runs when the primary is overloaded — latency matters
      # most then, and gemini-3.5-flash accepts 'minimal'.
      gemini-fallback-thinking-level: ${VOICE_STT_GEMINI_FALLBACK_THINKING_LEVEL:minimal}
      # Blank = detect the language per utterance, which is correct for
      # Moroccan clinicians who code-switch mid-sentence. Set to fr/ar/en
      # only to force it.
      language: ${VOICE_STT_LANGUAGE:}
      temperature: ${VOICE_STT_TEMPERATURE:0}
      # The primary's budget (including its own model fallback), each
      # fallback's, and the whole chain's — under the browser's 20 s wait.
      timeout-ms: ${VOICE_STT_TIMEOUT_MS:9000}
      fallback-timeout-ms: ${VOICE_STT_FALLBACK_TIMEOUT_MS:5000}
      total-budget-ms: ${VOICE_STT_TOTAL_BUDGET_MS:17000}
      # Transcripts below this recogniser confidence are dropped as noise
      # (AssemblyAI reports one). Measured: hallucinations 0.2-0.5, speech 0.7+.
      min-confidence: ${VOICE_STT_MIN_CONFIDENCE:0.55}
      max-audio-bytes: ${VOICE_STT_MAX_AUDIO_BYTES:15728640}
    # ── Throttling of the paid routes ──────────────────────────────────
    # Per signed-in user. A hands-free examination produces at most a dozen
    # clips a minute and one summary per consultation, so these stop a runaway
    # client or a stolen token spending the clinic's quota, not a busy doctor.
    # Set enabled=false when the proxy already throttles.
    rate-limit:
      enabled: ${VOICE_RATE_LIMIT_ENABLED:true}
      transcribe:
        per-minute: ${VOICE_RATE_LIMIT_TRANSCRIBE_PER_MINUTE:40}
        per-hour: ${VOICE_RATE_LIMIT_TRANSCRIBE_PER_HOUR:1200}
        concurrent: ${VOICE_RATE_LIMIT_TRANSCRIBE_CONCURRENT:6}
      interpret:
        per-minute: ${VOICE_RATE_LIMIT_INTERPRET_PER_MINUTE:30}
        per-hour: ${VOICE_RATE_LIMIT_INTERPRET_PER_HOUR:600}
        concurrent: ${VOICE_RATE_LIMIT_INTERPRET_CONCURRENT:3}
      summarize:
        per-minute: ${VOICE_RATE_LIMIT_SUMMARIZE_PER_MINUTE:6}
        per-hour: ${VOICE_RATE_LIMIT_SUMMARIZE_PER_HOUR:60}
        concurrent: ${VOICE_RATE_LIMIT_SUMMARIZE_CONCURRENT:1}
    # ── End-of-consultation summary ────────────────────────────────────
    # The prose the dentist reads at review, generated from the session's own
    # audit trail. Distinct from GET /voice/sessions/{id}/summary, which reads
    # the clinical tables back and generates nothing. Off by default for the
    # same reason as the NLU fallback: it sends what was dictated during a
    # consultation to a third party. Nothing it produces reaches a clinical
    # record without the dentist editing and saving it themselves.
    summary:
      # Off: no model is called and the review page gets the recorded
      # findings as a structured report. On: a model writes the narrative,
      # which is checked against the records (every tooth, no invented one)
      # before it is shown; a failed check tries the next route.
      enabled: ${VOICE_SUMMARY_ENABLED:false}
      provider: ${VOICE_SUMMARY_PROVIDER:groq}
      api-key: ${VOICE_SUMMARY_API_KEY:}
      # vendor:model, tried in order after provider/model.
      fallbacks: ${VOICE_SUMMARY_FALLBACKS:groq:qwen/qwen3.8-27b,deepseek:deepseek-flash}
      # A summary runs once per consultation, so latency is irrelevant and
      # quality is not: the smaller models' French degrades noticeably on
      # medical vocabulary. llama-3.3-70b-versatile is gated behind Groq's
      # enterprise tier and 404s on a standard key, so it is not the default.
      model: ${VOICE_SUMMARY_MODEL:openai/gpt-oss-120b}
      # Blank: the primary vendor's endpoint from orthoflow.voice.providers.
      base-url: ${VOICE_SUMMARY_BASE_URL:}
      # The language the summary is written in, as a name the model knows.
      language: ${VOICE_SUMMARY_LANGUAGE:French}
      timeout-ms: ${VOICE_SUMMARY_TIMEOUT_MS:30000}
      max-output-tokens: ${VOICE_SUMMARY_MAX_OUTPUT_TOKENS:1200}
      max-commands: ${VOICE_SUMMARY_MAX_COMMANDS:200}
    audit:
      # Keeping the raw utterance lets a pilot measure recognition accuracy.
      # A production clinic generally should not store speech transcripts
      # beside patient identifiers (audit XII.5) — application-prod.yml turns
      # this off. The interpreted command is always retained either way.
      store-transcript: ${VOICE_STORE_TRANSCRIPT:true}
  # ── Full-consultation recording ─────────────────────────────────────
  # The doctor and the patient talk; the whole conversation is transcribed and
  # kept, and what matters in it (identity, allergies, history, the treatment
  # plan, the next appointment) is proposed for the doctor to validate before
  # anything reaches the record. Unlike command dictation this KEEPS the raw
  # transcript — on purpose, so it can be reviewed later — which is why it is
  # its own switch, off by default. Turning it on needs a DPA with every vendor
  # in the chain, a lawful basis and a CNDP notification (Law 09-08), and the
  # doctor attests at the start of each consultation that the patient was told.
  consultation:
    enabled: ${CONSULTATION_ENABLED:false}
    # "Today", and what "in 15 days" resolves against, is the clinic's day.
    timezone: ${CONSULTATION_TIMEZONE:Africa/Casablanca}
    # Keep the raw conversation once the consultation is saved (a
    # CONSULTATION_TRANSCRIPT note, and on the consultation row). TESTING ONLY:
    # production keeps no transcript, and the prod profile refuses to start
    # with this on. Off, the transcript is held only while the consultation is
    # open (crash recovery) and erased when it is saved or discarded.
    retain-transcript: ${CONSULTATION_RETAIN_TRANSCRIPT:false}
    # An open consultation untouched for this long is discarded, transcript and
    # all (checked hourly). Runs even with the feature off.
    idle-discard-hours: ${CONSULTATION_IDLE_DISCARD_HOURS:24}
    extraction:
      # Off: nothing is sent to a model; the side panel still shows what simple
      # rules can read (phone, CIN, age, insurer, allergies).
      enabled: ${CONSULTATION_EXTRACTION_ENABLED:false}
      provider: ${CONSULTATION_EXTRACTION_PROVIDER:groq}
      model: ${CONSULTATION_EXTRACTION_MODEL:openai/gpt-oss-120b}
      # vendor:model, tried in order after provider/model. Keys: orthoflow.voice.providers.
      fallbacks: ${CONSULTATION_EXTRACTION_FALLBACKS:groq:qwen/qwen3.8-27b,deepseek:deepseek-flash}
      language: ${CONSULTATION_EXTRACTION_LANGUAGE:French}
      timeout-ms: ${CONSULTATION_EXTRACTION_TIMEOUT_MS:25000}
      max-output-tokens: ${CONSULTATION_EXTRACTION_MAX_OUTPUT_TOKENS:2200}
      max-transcript-chars: ${CONSULTATION_EXTRACTION_MAX_TRANSCRIPT_CHARS:60000}

  # ── Files (Denteam parity F5) ───────────────────────────────────────
  # Patient photos, the clinic logo, expense receipts, lab-order attachments.
  # A local volume today; StorageService is the seam for an S3-compatible
  # bucket later. Files are only ever served through authenticated endpoints.
  storage:
    local-root: ${STORAGE_LOCAL_ROOT:./data/files}

  # ── Outbound messages (F6) ──────────────────────────────────────────
  # Every channel is off until an operator turns it on; a message queued for a
  # channel that is off is cancelled with that reason rather than retried.
  # Message text is blanked after retention-days (Law 09-08); the delivery
  # record stays.
  messaging:
    retention-days: ${MESSAGING_RETENTION_DAYS:90}
    sender:
      enabled: ${MESSAGING_SENDER_ENABLED:true}
      batch-size: ${MESSAGING_BATCH_SIZE:20}
      max-attempts: ${MESSAGING_MAX_ATTEMPTS:6}
    email:
      # Also needs SPRING_MAIL_HOST (and, usually, _PORT/_USERNAME/_PASSWORD).
      enabled: ${MESSAGING_EMAIL_ENABLED:false}
      from: ${MESSAGING_EMAIL_FROM:no-reply@orthoflow.local}
    whatsapp:
      # The self-hosted Baileys bridge (a second instance of the service the
      # CRM uses). base-url is its address on the internal Docker network;
      # api-key is its API_KEY; webhook-secret is its WEBHOOK_SECRET; the bridge
      # posts receipts and replies to POST /api/v1/webhooks/whatsapp.
      enabled: ${WHATSAPP_ENABLED:false}
      base-url: ${WHATSAPP_BASE_URL:http://whatsapp-bot:3000}
      api-key: ${WHATSAPP_API_KEY:}
      session-id: ${WHATSAPP_SESSION_ID:orthoflow}
      webhook-secret: ${WHATSAPP_WEBHOOK_SECRET:}
      default-country-code: ${WHATSAPP_DEFAULT_COUNTRY_CODE:212}

  # ── Help centre (F6): "Ask OrthoFlow" ───────────────────────────────
  help:
    ask:
      # Off by default. When on, the question a person types and the matching help
      # notes are sent to the model vendor; see HelpProperties for why that is
      # the operator's decision.
      enabled: ${HELP_ASK_ENABLED:false}
      api-key: ${HELP_ANTHROPIC_API_KEY:}
      model: ${HELP_ASK_MODEL:claude-haiku-4-5-20251001}
      questions-per-hour: ${HELP_ASK_QUESTIONS_PER_HOUR:20}

  # ── Public pages (F7): online booking, self-registration, surveys ────
  public:
    # Per-IP ceilings in a window; writes are held far lower than reads.
    rate-limit:
      reads: ${PUBLIC_RATE_LIMIT_READS:120}
      writes: ${PUBLIC_RATE_LIMIT_WRITES:20}
      window-seconds: ${PUBLIC_RATE_LIMIT_WINDOW_SECONDS:300}

server:
  port: 8080
  servlet:
    context-path: /api/v1
  tomcat:
    # No request size limit existed at all (audit V.14) — POST /invoices
    # with 100,000 lines was accepted and processed with no bound. 2MB
    # comfortably covers any legitimate invoice/PO/treatment-invoice
    # payload this app sends while making a pathological body a fast 413,
    # not a slow OOM risk.
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
    connection-timeout: 20s

management:
  endpoints:
    web:
      exposure:
        # Not internet-reachable: Traefik only proxies /api/v1/** (see
        # docker-compose.production.yml labels), so /actuator/** is only
        # reachable by containers on the same Docker network — a future
        # Prometheus scraper included. See SecurityConfig for the matching
        # permitAll rule.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      # Mail goes through the messaging outbox, so an unconfigured or unreachable
      # SMTP server must not turn the whole API unhealthy: Traefik drops an
      # unhealthy backend's router, which would make a mail problem a full
      # outage. Note an empty SPRING_MAIL_HOST (what docker-compose passes when it
      # is unset) still counts as "set" and registers this indicator, which then
      # fails on every probe.
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    # correlationId comes from CorrelationIdFilter via MDC — "-" when a log
    # line is emitted outside a request (startup, scheduled jobs).
    level: "%5p [%X{correlationId:--}]"
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    com.orthoflow: INFO
