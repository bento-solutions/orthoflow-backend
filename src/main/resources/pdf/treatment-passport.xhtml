<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:dir="${dir}">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${t.title}">Treatment passport</title>
  <style th:replace="~{clinical-document-style :: style}"></style>
</head>
<body>
  <table class="head"><tr>
    <td>
      <div class="clinic" th:text="${letterhead.name}">Cabinet</div>
      <div class="legal" th:if="${letterhead.address != null}" th:text="${letterhead.address + (letterhead.city != null ? ', ' + letterhead.city : '')}"></div>
      <div class="legal" th:if="${letterhead.phone != null}" th:text="${letterhead.phone}"></div>
    </td>
    <td style="text-align:right;"><img th:if="${letterhead.logoDataUri != null}" th:src="${letterhead.logoDataUri}" style="max-height: 60px; max-width: 160px;" th:alt="${letterhead.name}"/></td>
  </tr></table>

  <h1 th:text="${t.title}">Treatment passport</h1>
  <div class="intro" th:text="${t.intro}">…</div>

  <div class="box">
    <div class="label" th:text="${t.patient}">Patient</div>
    <div><b th:text="${patientName}">Patient</b></div>
    <div th:if="${birthDate != null}" th:text="${t.birthDate + ' : ' + birthDate}"></div>
    <div th:if="${sex != null}" th:text="${t.gender + ' : ' + sex}"></div>
    <div class="legal" th:text="${t.issuedOn + ' ' + issuedOn}">Issued</div>
  </div>

  <h2 th:text="${t.alerts}">Allergies and medical alerts</h2>
  <div th:if="${#lists.isEmpty(alerts)}" class="muted" th:text="${t.noAlerts}">None</div>
  <ul class="plain" th:unless="${#lists.isEmpty(alerts)}">
    <li th:each="a : ${alerts}" th:text="${a}">Penicillin</li>
  </ul>

  <h2 th:text="${t.chart}">Dental chart</h2>
  <div th:replace="~{odontogram :: chart(${chart})}"></div>

  <h2 th:text="${t.teeth}">Present state of the teeth</h2>
  <div th:if="${#lists.isEmpty(teethGrid.rows)}" class="muted" th:text="${t.noTeeth}">Nothing</div>
  <table th:unless="${#lists.isEmpty(teethGrid.rows)}" th:replace="~{passport-grid :: grid(${teethGrid})}"></table>

  <h2 th:text="${t.log}">Treatment log</h2>
  <div th:if="${#lists.isEmpty(logGrid.rows)}" class="muted" th:text="${t.noLog}">None</div>
  <table th:unless="${#lists.isEmpty(logGrid.rows)}" th:replace="~{passport-grid :: grid(${logGrid})}"></table>

  <h2 th:text="${t.planned}">Work still to do</h2>
  <div th:if="${#lists.isEmpty(plannedGrid.rows)}" class="muted" th:text="${t.noPlanned}">None</div>
  <table th:unless="${#lists.isEmpty(plannedGrid.rows)}" th:replace="~{passport-grid :: grid(${plannedGrid})}"></table>

  <h2 th:text="${t.gums}">Gum health</h2>
  <div th:if="${#lists.isEmpty(gumsGrid.rows)}" class="muted" th:text="${t.noGums}">Not assessed</div>
  <table th:unless="${#lists.isEmpty(gumsGrid.rows)}" th:replace="~{passport-grid :: grid(${gumsGrid})}"></table>

  <div class="note" th:text="${t.legend}">Legend</div>

  <table class="sign"><tr>
    <td><div class="label" th:text="${t.signature}">Signature</div></td>
  </tr></table>

  <div class="foot"><span th:text="${t.consent}">Issued at the patient's request.</span> <span th:text="${t.machineCopy}">Machine copy.</span></div>

</body>
</html>
