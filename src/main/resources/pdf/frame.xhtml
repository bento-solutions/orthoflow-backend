<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<!--
  The frame every printed document shares: the page box, the palette, and the clinic's header and
  legal footer, which repeat on every page as running elements. A template puts
      <style th:replace="~{frame :: style('A4', '40mm 14mm 20mm 14mm')}"></style>
  in its head, and these two as the first things in its body, before any content:
      <div th:replace="~{frame :: header(${title}, ${reference}, ${practitionerLine})}"></div>
      <div th:replace="~{frame :: footer(${withRib})}"></div>
  title is what the document is (null leaves the right-hand column out, for a narrow page whose body
  already says it); reference is its number and date, parts separated by " · " going on lines of their own.
  It needs ${letterhead} in the model. Its own styles go in a second <style> after the first.
-->
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <style th:fragment="style(size, margin)">
    /* Palette: petrol (the app's colour), a mint accent, and their tints. */
    @page {
      size: [(${size})];
      margin: [(${margin})];
      @top-center { content: element(page-header); vertical-align: bottom; padding-bottom: 4mm; }
      /* The footer is a solid band across the whole width of the page: the two bottom corners carry its colour too. */
      @bottom-left-corner { content: ""; background-color: #1d6577; border-top: 1.6mm solid #8fd3c8; }
      @bottom-center { content: element(page-footer); vertical-align: middle; background-color: #1d6577; border-top: 1.6mm solid #8fd3c8; }
      @bottom-right-corner { content: ""; background-color: #1d6577; border-top: 1.6mm solid #8fd3c8; }
      /* The side boxes are empty, but painted: on a narrow page (A5) the centre box can stop short of the
         corner by a hairline, which showed as a white seam in the band. */
      @bottom-left { content: ""; background-color: #1d6577; border-top: 1.6mm solid #8fd3c8; }
      @bottom-right { content: ""; background-color: #1d6577; border-top: 1.6mm solid #8fd3c8; }
    }
    body { font-family: 'DejaVu Sans', sans-serif; font-size: 9.5pt; color: #1f2933; }

    /* The clinic's identity is written in Latin script: it reads left to right in an Arabic document too. */
    #page-header { position: running(page-header); width: 100%; direction: ltr; text-align: left; }
    #page-footer { position: running(page-footer); width: 100%; direction: ltr; text-align: left; }
    table.ph { width: 100%; border-collapse: collapse; }
    table.ph td { vertical-align: bottom; padding: 0; }
    td.ph-logo { width: 1%; padding-right: 4mm; }
    td.ph-logo img { max-height: 18mm; max-width: 44mm; }
    .ph-name { font-size: 14pt; font-weight: bold; color: #1d6577; }
    .ph-who { font-size: 8.5pt; font-weight: bold; color: #2f8f86; margin-top: 0.6mm; }
    .ph-line { font-size: 7.8pt; color: #52606d; margin-top: 0.4mm; }
    td.ph-doc { text-align: right; width: 40mm; padding-left: 3mm; }
    [dir=rtl] td.ph-doc { direction: rtl; }
    .nw { white-space: nowrap; }
    .ph-title { font-size: 7.5pt; font-weight: bold; color: #1d6577; text-transform: uppercase; letter-spacing: 0.6pt; margin-top: 1.5mm; }
    .ph-ref { font-size: 7.5pt; color: #52606d; margin-top: 0.3mm; }

    /* The corner motif: small shapes in the palette, the same on every document. */
    table.motif { border-collapse: separate; border-spacing: 1mm; margin-left: auto; margin-right: -1mm; }
    table.motif td { width: 4.6mm; height: 4.6mm; padding: 0; vertical-align: middle; }
    .m { width: 4.6mm; height: 4.6mm; }
    .m-dot { width: 1.4mm; height: 1.4mm; border-radius: 0.7mm; background-color: #8fd3c8; margin: 0 auto; }
    .m-circle { border-radius: 2.3mm; }
    .m-q1 { border-top-left-radius: 4.6mm; }
    .m-q2 { border-top-right-radius: 4.6mm; }
    .m-q3 { border-bottom-right-radius: 4.6mm; }
    .m-q4 { border-bottom-left-radius: 4.6mm; }
    .m-ring { border: 1.1mm solid #8fd3c8; width: 2.4mm; height: 2.4mm; border-radius: 2.3mm; }
    .m-small { width: 2.6mm; height: 2.6mm; margin: 0 auto; }
    .c1 { background-color: #1d6577; } .c2 { background-color: #8fd3c8; } .c3 { background-color: #cfe9ec; } .c4 { background-color: #4fa9b8; }
    .rule { height: 0.8mm; background-color: #1d6577; margin-top: 2.5mm; }
    .rule-accent { height: 0.8mm; width: 30%; background-color: #8fd3c8; }

    table.pf { width: 100%; border-collapse: collapse; }
    table.pf td { vertical-align: middle; font-size: 7pt; color: #e6f3f2; line-height: 1.45; }
    .pf-name { font-weight: bold; color: #ffffff; }
    .pf-note { font-weight: bold; color: #8fd3c8; letter-spacing: 0.3pt; }
    td.pf-page { text-align: right; width: 16mm; white-space: nowrap; color: #ffffff; font-weight: bold; direction: ltr; font-size: 7.5pt; }
    .pageno::before { content: counter(page); }
    .pagecount::before { content: counter(pages); }

    /* The document's name: large and in colour, its number and date under it. */
    h1 { font-size: 24pt; margin: 0 0 1mm 0; color: #1d6577; letter-spacing: 0.6pt; }
    h1 .h1-no { font-size: 11pt; color: #2f8f86; letter-spacing: 0.3pt; text-transform: none; }
    .docno { font-size: 10.5pt; font-weight: bold; color: #2f8f86; margin-bottom: 1mm; }
    .who { font-size: 11pt; font-weight: bold; color: #1f2933; margin-top: 0.8mm; }
    h2 { font-size: 11pt; margin: 14px 0 4px 0; color: #1d6577; border-bottom: 1.2pt solid #8fd3c8; padding-bottom: 2px; }
    .subtitle { color: #52606d; font-size: 8.5pt; margin: 0 0 3mm 0; }
    .legal { font-size: 8pt; color: #52606d; }
    .muted { color: #7b8794; }
    .label { color: #2f8f86; font-size: 7.3pt; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5pt; }
    .box { padding: 6px 9px; background-color: #f1f8f8; border-left: 2.2pt solid #8fd3c8; }
    [dir=rtl] .box { border-left: none; border-right: 2.2pt solid #8fd3c8; }
    .meta { width: 100%; margin: 4mm 0 5mm 0; border-collapse: collapse; }
    .meta td { vertical-align: top; width: 50%; padding: 0 3mm 0 0; }
    .meta td + td { padding: 0 0 0 3mm; }
    .stamp { color: #b91c1c; font-weight: bold; border: 1.5pt solid #b91c1c; padding: 1px 7px; font-size: 9pt; margin-left: 8px; letter-spacing: 0.5pt; }

    /* Lines: a coloured band for the column titles, light rules between rows, every other row tinted. */
    table.lines { width: 100%; border-collapse: collapse; margin-top: 2mm; }
    table.lines th { background-color: #1d6577; color: #ffffff; padding: 7px 8px; font-size: 7.5pt; text-align: left; text-transform: uppercase; letter-spacing: 0.5pt; border: none; }
    table.lines td { border: none; border-bottom: 0.6pt solid #dbe7e9; padding: 8px 8px; vertical-align: top; }
    table.lines tbody tr:nth-child(even) td { background-color: #f4f9f9; }
    table.lines tr { page-break-inside: avoid; }
    [dir=rtl] table.lines th { text-align: right; }
    .right { text-align: right; } .center { text-align: center; }
    th.right, table.lines th.right { text-align: right; } th.center, table.lines th.center { text-align: center; }

    /* Totals: quiet rows, then the total on a band in the accent colour. */
    table.totals { width: 50%; margin-left: auto; border-collapse: collapse; margin-top: 4mm; page-break-inside: avoid; }
    [dir=rtl] table.totals { margin-left: 0; margin-right: auto; }
    table.totals td { padding: 3px 8px; }
    table.totals tr.grand td { font-weight: bold; background-color: #8fd3c8; color: #123f4a; font-size: 11pt; padding: 6px 8px; }
    table.totals tr.after-grand td { padding-top: 5px; }
    table.totals tr.due td { font-weight: bold; color: #1d6577; }

    .words { margin-top: 5mm; padding: 6px 9px; background-color: #f1f8f8; border-left: 2.2pt solid #1d6577; page-break-inside: avoid; }
    [dir=rtl] .words { border-left: none; border-right: 2.2pt solid #1d6577; }

    /* The foot of a document: how to pay or the conditions on the left, the signature on the right. */
    table.close { width: 100%; margin-top: 8mm; border-collapse: collapse; page-break-inside: avoid; }
    table.close td { width: 50%; vertical-align: top; padding: 0 4mm 0 0; }
    table.close td + td { padding: 0 0 0 4mm; }
    .close-h { font-size: 9pt; font-weight: bold; color: #1d6577; margin-bottom: 1.5mm; }
    .close-line { font-size: 8pt; color: #3e4c59; margin-top: 0.6mm; }
    .sign-space { height: 20mm; }
    .sign-rule { border-top: 0.8pt solid #1d6577; padding-top: 1.2mm; text-align: center; font-size: 7.5pt; color: #52606d; text-transform: uppercase; letter-spacing: 0.4pt; }

    table.sign { margin-top: 8mm; width: 100%; page-break-inside: avoid; border-collapse: collapse; }
    table.sign td { width: 50%; vertical-align: bottom; padding: 0 4mm; }
    table.sign td .sign-space { height: 22mm; }

    /* A draft says so across the page. */
    /* Behind everything and pale, low on the page: the space a short document leaves above its sign-off, clear of the totals. */
    .draft-mark { position: fixed; top: 150mm; left: 0; width: 100%; text-align: center; font-size: 72pt; font-weight: bold; color: #eff5f6; letter-spacing: 6pt; z-index: -1; }
  </style>
</head>
<body>
  <!-- The header: the clinic on the left, under its logo's side, and what this document is on the right. -->
  <div th:fragment="header(title, reference, practitionerLine)" id="page-header" dir="ltr">
    <table class="ph"><tr>
      <td class="ph-logo" th:if="${letterhead.logoDataUri != null}"><img th:src="${letterhead.logoDataUri}" th:alt="${letterhead.name}"/></td>
      <td>
        <div class="ph-name" th:text="${letterhead.name}">Cabinet</div>
        <div class="ph-who" th:if="${practitionerLine != null}" th:text="${practitionerLine}">Dr · INPE</div>
        <div class="ph-line" th:if="${letterhead.addressLine() != null}" th:text="${letterhead.addressLine()}">Adresse</div>
        <div class="ph-line" th:unless="${letterhead.contactParts().isEmpty()}"><th:block th:each="part, at : ${letterhead.contactParts()}"><span class="nw" th:text="${at.last ? part : part + ' ·'}">05 22 00 00 00 ·</span> </th:block></div>
      </td>
      <td class="ph-doc">
        <table class="motif"><tr>
          <td><div class="m c3 m-circle"></div></td><td><div class="m c1 m-q2"></div></td><td><div class="m-dot"></div></td><td><div class="m c2 m-q1"></div></td><td><div class="m c3"></div></td><td><div class="m c1 m-circle"></div></td>
        </tr><tr>
          <td><div class="m-dot"></div></td><td><div class="m c2 m-q4"></div></td><td><div class="m c4 m-small"></div></td><td><div class="m c1 m-q3"></div></td><td><div class="m-ring"></div></td><td><div class="m c2 m-q4"></div></td>
        </tr><tr>
          <td></td><td><div class="m-dot"></div></td><td><div class="m c3 m-q3"></div></td><td><div class="m-dot"></div></td><td><div class="m c1 m-q4"></div></td><td><div class="m c3 m-q2"></div></td>
        </tr></table>
        <th:block th:if="${title != null}">
          <div class="ph-title" th:text="${title}">Document</div>
          <th:block th:if="${reference != null}"><div class="ph-ref" th:each="part : ${#strings.arraySplit(reference, '·')}" th:text="${#strings.trim(part)}">N°</div></th:block>
        </th:block>
      </td>
    </tr></table>
    <div class="rule"><div class="rule-accent"></div></div>
  </div>

  <!-- The footer: the clinic's legal identity (and its RIB on a document that asks to be paid), and the page. -->
  <div th:fragment="footer(withRib)" id="page-footer" dir="ltr">
    <table class="pf"><tr>
      <td>
        <div th:unless="${letterhead.legalParts().isEmpty()}"><th:block th:each="part, at : ${letterhead.legalParts()}"><span class="nw" th:classappend="${at.first ? 'pf-name' : ''}" th:text="${at.last ? part : part + ' ·'}">ICE ·</span> </th:block></div>
        <div th:if="${withRib and letterhead.ribLine() != null}" th:text="${letterhead.ribLine()}">RIB</div>
        <div class="pf-note" th:if="${confidentialNote != null}" th:text="${confidentialNote}">Document médical confidentiel</div>
      </td>
      <td class="pf-page"><span class="pageno"></span> / <span class="pagecount"></span></td>
    </tr></table>
  </div>
</body>
</html>
