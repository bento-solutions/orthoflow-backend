<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<!-- An ordonnance: the clinic and the prescriber at the top, the patient, the drugs with
     their posology, the advice, and room for the signature and stamp. French, as Moroccan
     pharmacies read it. -->
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${'Ordonnance ' + number}">Ordonnance</title>
  <style th:replace="~{frame :: style('A5', '34mm 12mm 18mm 12mm')}"></style>
  <style>
    .ph-name { font-size: 11.5pt; }
    td.ph-logo img { max-height: 14mm; max-width: 32mm; }
    td.ph-doc { width: 24mm; }
    table.motif { border-spacing: 0.6mm; }
    table.motif td, .m { width: 2.8mm; height: 2.8mm; }
    .m-circle { border-radius: 1.4mm; }
    .m-q1 { border-top-left-radius: 2.8mm; } .m-q2 { border-top-right-radius: 2.8mm; } .m-q3 { border-bottom-right-radius: 2.8mm; } .m-q4 { border-bottom-left-radius: 2.8mm; }
    .m-ring { width: 1.2mm; height: 1.2mm; border-width: 0.8mm; border-radius: 1.4mm; }
    .m-small { width: 1.6mm; height: 1.6mm; }
    .m-dot { width: 1mm; height: 1mm; border-radius: 0.5mm; }
    table.top { width: 100%; border-collapse: collapse; margin: 0 0 4mm 0; }
    table.top td { padding: 0; vertical-align: top; font-size: 8pt; color: #52606d; }
    table.top td.place { text-align: right; font-size: 9.5pt; color: #1f2933; }
    .patient { margin-bottom: 4mm; }
    h1 { font-size: 13pt; text-align: center; letter-spacing: 2px; margin: 2mm 0 5mm 0; }
    .rx { margin: 0 0 9px 0; page-break-inside: avoid; }
    .drug { font-weight: bold; }
    .dci { color: #52606d; font-size: 8.5pt; }
    .posology { margin: 1px 0 0 12px; }
    .advice { margin-top: 12px; padding: 6px 8px; border: 1px dashed #9aa5b1; font-size: 8.5pt; }
    .advice.hand { font-size: 11pt; } .hand .dci { font-size: 10pt; }
    .sign { margin-top: 10mm; text-align: right; font-size: 8pt; color: #52606d; page-break-inside: avoid; }
  </style>
</head>
<body>
  <div th:replace="~{frame :: header(null, null, ${practitioner != null ? letterhead.practitionerLine(practitioner.name, practitioner.inpe) : letterhead.practitionerLine(null, null)})}"></div>
  <div th:replace="~{frame :: footer(false)}"></div>

  <table class="top"><tr>
    <td th:text="${'N° ' + number}">N°</td>
    <td class="place" th:text="${signedAt}">Casablanca, le</td>
  </tr></table>
  <div class="patient"><b th:text="${patient.name}">Patient</b><span th:if="${patient.age != null}" th:text="${' — ' + patient.age}"></span></div>

  <h1>ORDONNANCE</h1>

  <div class="rx hand" th:each="l : ${lines}">
    <div><span class="drug" th:text="${l.drug}">Drug</span><span th:if="${l.form != null}" th:text="${' — ' + l.form}"></span></div>
    <div class="dci" th:if="${l.dci != null}" th:text="${l.dci}">DCI</div>
    <div class="posology" th:text="${l.posology}">Posologie</div>
  </div>

  <div class="advice hand" th:if="${!advice.isEmpty()}">
    <div th:each="a : ${advice}" th:text="${a}">Conseil</div>
  </div>

  <div id="page-fill" class="page-fill" th:style="${pageFill == null ? null : 'height:' + pageFill + 'px'}"></div>
  <div class="sign">Signature et cachet du praticien</div>
  <div id="page-end"></div>
</body>
</html>
