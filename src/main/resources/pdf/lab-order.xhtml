<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:dir="${dir}">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${'Bon de laboratoire ' + order.reference}">Bon de laboratoire</title>
  <style th:replace="~{frame :: style('A4', '38mm 14mm 24mm 14mm')}"></style>
</head>
<body>
  <div th:replace="~{frame :: header('Bon de laboratoire', ${'N° ' + order.reference + (order.sentDate != '' ? ' · ' + order.sentDate : '')}, ${practitionerLine})}"></div>
  <div th:replace="~{frame :: footer(false)}"></div>

  <h1>BON DE LABORATOIRE <span th:text="${'N° ' + order.reference}">N° 1</span><span class="stamp" th:if="${order.urgent}">URGENT</span></h1>
  <div class="legal" th:if="${order.sentDate != ''}" th:text="${'Envoyé le ' + order.sentDate}">Date</div>

  <table class="meta"><tr>
    <td><div class="box">
      <div class="label">Laboratoire</div>
      <div><b th:text="${lab.name}">Lab</b></div>
      <div th:if="${lab.contact != ''}" th:text="${lab.contact}"></div>
    </div></td>
    <td><div class="box">
      <div class="label">Patient</div>
      <div><b th:text="${patient.fullName}">Patient</b></div>
      <div th:if="${birthDate != null}" th:text="${'Né(e) le ' + birthDate}"></div>
      <div class="label" style="margin-top:6px;">Praticien</div>
      <div th:text="${practitioner}">Dr</div>
    </div></td>
  </tr></table>

  <table class="lines">
    <thead><tr><th>Travail demandé</th><th>Description</th><th>À rendre pour le</th></tr></thead>
    <tbody><tr>
      <td><b th:text="${order.itemType}">ALIGNER</b></td>
      <td th:text="${order.description}">…</td>
      <td th:text="${order.dueDate != '' ? order.dueDate : '—'}">—</td>
    </tr></tbody>
  </table>

  <div class="words" th:if="${order.notes != ''}"><b>Instructions :</b> <span th:text="${order.notes}">…</span></div>

  <table class="sign"><tr>
    <td><div class="label">Reçu par le laboratoire</div></td>
    <td><div class="label">Cachet et signature du praticien</div></td>
  </tr></table>
</body>
</html>
