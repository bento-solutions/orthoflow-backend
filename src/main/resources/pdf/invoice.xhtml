<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<!-- An invoice as the clinic hands it over. Rendered by the server (InvoicePdfService) rather than
     drawn in the browser with jsPDF: one letterhead, the patient's real name, tagged for screen readers. -->
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:dir="${dir}">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${labels.title + ' ' + invoice.number}">Invoice</title>
  <style>
    @page { size: A4; margin: 16mm 14mm 18mm 14mm; @bottom-center { content: counter(page) " / " counter(pages); font-size: 8pt; color: #666; } }
    body { font-family: 'DejaVu Sans', sans-serif; font-size: 9.5pt; color: #1f2933; }
    .head { width: 100%; border-bottom: 2px solid #1d4ed8; padding-bottom: 8px; margin-bottom: 14px; }
    .head td { vertical-align: top; }
    .clinic { font-size: 14pt; font-weight: bold; color: #1d4ed8; }
    .legal { font-size: 8pt; color: #52606d; }
    h1 { font-size: 15pt; margin: 6px 0 2px 0; letter-spacing: 0.5px; }
    .meta { width: 100%; margin: 8px 0 14px 0; }
    .meta td { vertical-align: top; width: 50%; padding-right: 10px; }
    .box { border: 1px solid #c5d0ea; padding: 6px 8px; background: #f7f9fd; }
    .label { color: #7b8794; font-size: 8pt; text-transform: uppercase; }
    table.lines { width: 100%; border-collapse: collapse; margin-top: 4px; }
    table.lines th { background: #e8eefc; border: 1px solid #c5d0ea; padding: 4px 6px; font-size: 8.5pt; text-align: left; }
    table.lines td { border: 1px solid #dde3ee; padding: 4px 6px; }
    .right { text-align: right; } .center { text-align: center; }
    [dir=rtl] table.lines th { text-align: right; }
    table.totals { width: 55%; margin-left: auto; border-collapse: collapse; margin-top: 8px; }
    [dir=rtl] table.totals { margin-left: 0; margin-right: auto; }
    table.totals td { padding: 3px 6px; }
    table.totals tr.grand td { font-weight: bold; border-top: 2px solid #1d4ed8; font-size: 11pt; }
    .foot { margin-top: 18px; font-size: 7.5pt; color: #7b8794; border-top: 1px solid #dde3ee; padding-top: 4px; }
  </style>
</head>
<body>
  <table class="head"><tr>
    <td>
      <div class="clinic" th:text="${letterhead.name}">Cabinet</div>
      <div class="legal" th:if="${letterhead.legalName != null}" th:text="${letterhead.legalName}"></div>
      <div class="legal" th:if="${letterhead.address != null}" th:text="${letterhead.address + (letterhead.city != null ? ', ' + letterhead.city : '')}"></div>
      <div class="legal" th:if="${letterhead.phone != null}" th:text="${letterhead.phone}"></div>
    </td>
    <td class="right"><img th:if="${letterhead.logoDataUri != null}" th:src="${letterhead.logoDataUri}" style="max-height: 60px; max-width: 160px;" th:alt="${letterhead.name}"/></td>
  </tr></table>

  <h1><span th:text="${labels.title}">FACTURE</span> <span th:text="${'N° ' + invoice.number}">N° 1</span></h1>

  <table class="meta"><tr>
    <td><div class="box">
      <div class="label" th:text="${labels.patient}">Patient</div>
      <div><b th:text="${invoice.patient}">Patient</b></div>
      <div th:if="${invoice.patientCode != null}" th:text="${labels.file + ' ' + invoice.patientCode}"></div>
    </div></td>
    <td><div class="box">
      <div><span class="label" th:text="${labels.issued}">Date</span> <span th:text="${invoice.issued}"></span></div>
      <div th:if="${invoice.due != null}"><span class="label" th:text="${labels.due}">Échéance</span> <span th:text="${invoice.due}"></span></div>
      <div><span class="label" th:text="${labels.status}">Statut</span> <span th:text="${invoice.status}"></span></div>
    </div></td>
  </tr></table>

  <table class="lines">
    <thead><tr>
      <th scope="col" th:text="${labels.code}">Code</th>
      <th scope="col" th:text="${labels.description}">Désignation</th>
      <th scope="col" class="right" th:text="${labels.qty}">Qté</th>
      <th scope="col" class="right" th:text="${labels.unit}">P.U.</th>
      <th scope="col" class="right" th:text="${labels.discount}">Remise</th>
      <th scope="col" class="right" th:text="${labels.total}">Total</th>
    </tr></thead>
    <tbody>
      <tr th:each="line : ${invoice.lines}">
        <td th:text="${line.code}"></td>
        <td th:text="${line.label}"></td>
        <td class="right" th:text="${line.qty}"></td>
        <td class="right" th:text="${line.unit}"></td>
        <td class="right" th:text="${line.discount}"></td>
        <td class="right" th:text="${line.total}"></td>
      </tr>
    </tbody>
  </table>

  <table class="totals">
    <tr><td th:text="${labels.subtotal}">Sous-total</td><td class="right" th:text="${invoice.subtotal}"></td></tr>
    <tr th:if="${invoice.discount != null}"><td th:text="${labels.discount}">Remise</td><td class="right" th:text="${'-' + invoice.discount}"></td></tr>
    <tr><td th:text="${labels.tax}">TVA</td><td class="right" th:text="${invoice.tax}"></td></tr>
    <tr class="grand"><td th:text="${labels.total}">Total</td><td class="right" th:text="${invoice.total + ' ' + invoice.currency}"></td></tr>
    <tr><td th:text="${labels.paid}">Réglé</td><td class="right" th:text="${invoice.paid}"></td></tr>
    <tr><td th:text="${labels.balance}">Reste dû</td><td class="right" th:text="${invoice.balance}"></td></tr>
  </table>

  <div class="foot" th:text="${labels.generated + ' ' + generatedAt}">Généré le</div>
</body>
</html>
