<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:dir="${dir}">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${t.chart}">Dental chart</title>
  <style th:replace="~{clinical-document-style :: style}"></style>
</head>
<body>
  <table class="head"><tr>
    <td>
      <div class="clinic" th:text="${letterhead.name}">Cabinet</div>
      <div class="legal" th:if="${letterhead.address != null}" th:text="${letterhead.address + (letterhead.city != null ? ', ' + letterhead.city : '')}"></div>
      <div class="legal" th:if="${letterhead.phone != null}" th:text="${letterhead.phone}"></div>
    </td>
    <td style="text-align:right;"><img th:if="${letterhead.logoDataUri != null}" th:src="${letterhead.logoDataUri}" style="max-height: 60px; max-width: 160px;" alt=""/></td>
  </tr></table>

  <h1 th:text="${t.chart}">Dental chart</h1>
  <div class="box">
    <b th:text="${patientName}">Patient</b>
    <span th:if="${birthDate != null}" th:text="${' · ' + t.birthDate + ' : ' + birthDate}"></span>
    <span class="legal" th:text="${' · ' + t.issuedOn + ' ' + issuedOn}">Issued</span>
  </div>

  <div th:replace="~{odontogram :: chart(${chart})}"></div>

  <div class="note" th:text="${t.legend}">Legend</div>
</body>
</html>
