spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET must be set in production}
  frontend-url: ${FRONTEND_URL:?FRONTEND_URL must be set in production}

logging:
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    com.orthoflow: INFO

orthoflow:
  # See AuthController#register / application.yml. Defaults to TRUE in
  # production: /auth/register is public (it has to be, to create the very
  # first account on an empty database), so with this off anyone on the
  # internet can POST a new account — and RegisterRequest carries the role,
  # so anyone can mint themselves an ADMIN. On means: the first account only
  # (bootstrap, forced to ADMIN by the controller), and every account after
  # that requires an authenticated ADMIN. Only set
  # RESTRICT_REGISTRATION_TO_BOOTSTRAP=false on a throwaway environment.
  auth:
    restrict-registration-to-bootstrap: ${RESTRICT_REGISTRATION_TO_BOOTSTRAP:true}
  # No default in production: a deployment that forgets this fails to start
  # rather than silently serving a frontend it does not trust.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set in production}
  voice:
    stt:
      # Stays off unless VOICE_STT_ENABLED=true is set explicitly for this
      # deployment. Turning it on sends consultation-room audio to the
      # configured Whisper provider, which needs a DPA, a lawful basis and a
      # CNDP notification (Law 09-08) — the same bar as the NLU fallback.
      # The browser's on-device / built-in recognition is used until then.
      enabled: ${VOICE_STT_ENABLED:false}
    audit:
      # Audit XII.5: do not retain raw speech transcripts alongside patient
      # identifiers in production. The interpreted command, its confidence and
      # what it changed are still recorded in full — only the utterance is
      # dropped. Override deliberately (and document why) if a supervised
      # pilot needs transcripts to measure recognition accuracy.
      store-transcript: ${VOICE_STORE_TRANSCRIPT:false}
