# Active on a bare local run (spring.profiles.default in application.yml) and
# nowhere that names a profile of its own. The verbose logging lives here, not
# in the base file, so a staging or pilot deployment does not write SQL and
# security traces to its logs by accident.
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    com.orthoflow: DEBUG

orthoflow:
  voice:
    # No patient data on a development machine: vendor keys work without the
    # data-protection attestation that every other profile insists on.
    require-data-protection: ${VOICE_REQUIRE_DATA_PROTECTION:false}
